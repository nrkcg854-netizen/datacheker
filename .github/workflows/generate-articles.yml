name: Generate Articles JSON

on:
  push:
    paths:
      - 'articles/**'
      - 'js/generate-list.js'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: articles.json生成
        run: node js/generate-list.js

      - name: 変更をcommit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add articles.json

          git diff --cached --quiet || git commit -m "Auto generate articles.json"

          git push
