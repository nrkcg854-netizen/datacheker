<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>節約記事一覧｜ギガ使用ペースチェッカー</title>
</head>
<body>
    <h1>節約記事一覧</h1>
    
    <!-- このulタグの中に自動でリストが入ります -->
    <ul id="article-list"></ul>

    <script>
        // 自動作成された articles.json を読み込む
        fetch('/articles.json')
            .then(response => response.json())
            .then(articles => {
                const listElement = document.getElementById('article-list');
                
                // 記事の数だけ <li><a href="...">タイトル</a></li> を作る
                articles.forEach(article => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    
                    // リンク先の設定（/articles/ファイル名.html）
                    a.href = '/articles/' + article.filename;
                    // タイトルの設定
                    a.textContent = article.title;
                    
                    li.appendChild(a);
                    listElement.appendChild(li);
                });
            })
            .catch(error => {
                console.error('記事の読み込みに失敗しました:', error);
                document.getElementById('article-list').innerHTML = '<li>記事を読み込めませんでした。</li>';
            });
    </script>
</body>
</html>
