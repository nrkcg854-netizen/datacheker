  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/style.css">
  
  <!-- 構造化データ - WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ギガ使用ペースチェッカー",
    "url": "https://gigapace-checker.vercel.app/",
    "description": "月のデータ通信量を診断して、本当に必要なギガ数を把握。3GB・7GB・20GBプランの選び方や節約術も紹介。",
    "potentialAction": {

      "target": "https://gigapace-checker.vercel.app/articles/?q={search_term_string}",
      "query-input": "required name=search_term_string"

  <!-- 構造化データ - Organization -->
  <script type="application/ld+json">

    "name": "ギガ使用ペースチェッカー",
    "url": "https://gigapace-checker.vercel.app/",

</head>
<body>
  <!-- header.js がここにヘッダーを挿入 -->

  <!-- ヒーローセクション -->
  <section class="hero-bg">
    <div class="container" style="text-align: center; padding: 4rem 1.5rem;">
      <h1 style="font-size: 2.5rem; margin-bottom: 1.5rem; color: var(--teal);">
        あなたに最適な<br>データプランを診断
      </h1>
      <p style="font-size: 1.25rem; color: var(--text-muted); margin-bottom: 2.5rem; line-height: 1.75;">
        月に本当に必要なギガ数を30秒で診断。<br>
        3GB・7GB・20GB、どのプランがベスト？
      </p>
      <a href="/tools/data-checker/index.html" class="btn btn-primary" style="font-size: 1.25rem; padding: 1.25rem 3rem;">
        無料で診断する
      </a>
    </div>
  </section>

  <!-- 特徴セクション -->
  <section class="container" style="margin-top: 4rem;">
    <h2 style="text-align: center; margin-bottom: 3rem;">ギガペースチェッカーの特徴</h2>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem;">
      <!-- カード1 -->
      <div class="card">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📊</div>
        <h3 style="color: var(--teal); margin-bottom: 1rem;">30秒で診断完了</h3>
        <p style="color: var(--text-muted); line-height: 1.65;">
          簡単な質問に答えるだけで、あなたに必要なデータ通信量がわかります。
        </p>
      </div>

      <!-- カード2 -->
      <div class="card">
        <div style="font-size: 3rem; margin-bottom: 1rem;">💰</div>
        <h3 style="color: var(--teal); margin-bottom: 1rem;">プラン選びの失敗を防ぐ</h3>
        <p style="color: var(--text-muted); line-height: 1.65;">
          大容量プランで無駄な出費をしたり、低容量で速度制限に悩むことがなくなります。
        </p>
      </div>

      <!-- カード3 -->
      <div class="card">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📱</div>
        <h3 style="color: var(--teal); margin-bottom: 1rem;">節約術も紹介</h3>
        <p style="color: var(--text-muted); line-height: 1.65;">
          診断結果に合わせて、データ通信量を節約する具体的な方法も提案します。
        </p>
      </div>
    </div>
  </section>

  <<!-- 人気記事セクション → 最新記事セクション -->
<section class="container" style="margin-top: 5rem;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2 style="margin: 0;">最新の節約記事</h2>
    <a href="/articles/" style="color: var(--teal-light); font-weight: 600; font-size: 1rem;">
      記事一覧を見る →
    </a>
  </div>
  
  <!-- 記事一覧（自動生成） -->
  <div id="popular-articles" style="display: grid; gap: 1.5rem;">
    <p style="text-align: center; color: var(--text-muted);">記事を読み込み中...</p>
  </div>
</section>
  <!-- CTAセクション -->
  <div id="cta-container"></div>

  <!-- footer.js がここにフッターを挿入 -->

  <!-- JavaScript -->
  <script src="/analytics.js" defer></script>
  <script src="/header.js" defer></script>
  <script src="/footer.js" defer></script>
  <script src="/js/cta.js" defer></script>
  <script src="/js/main.js" defer></script>

  <!-- 人気記事表示スクリプト -->
  <script>
  document.addEventListener("DOMContentLoaded", async function() {
    const container = document.getElementById('popular-articles');
    
    try {
      const response = await fetch('/articles.json');
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const articles = await response.json();
      
      container.innerHTML = '';
      
      if (articles.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">現在公開されている記事はありません。</p>';
        return;
      }

      // 最新3件を表示
      const recentArticles = articles.slice(0, 3);
      
      recentArticles.forEach(article => {
        const articleUrl = `/articles/${article.filename}`;
        const dateHtml = article.date 
          ? `<span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">${article.date}</span>` 
          : '';

        const cardHTML = `
          <a href="${articleUrl}" style="text-decoration: none; color: inherit; display: block;">
            <div class="card" style="padding: 1.75rem;">
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                  <span style="background: var(--gradient-primary); color: white; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em;">節約ガイド</span>
                  ${dateHtml}
                </div>
                <h3 style="margin: 0; font-size: 1.25rem; color: var(--teal); line-height: 1.4;">${article.title}</h3>
                <p style="font-size: 0.95rem; color: var(--text-muted); margin: 0; line-height: 1.65;">${article.description}</p>
              </div>
            </div>
          </a>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });

      // カードにフェードインアニメーション
      const cards = container.querySelectorAll('.card');
      cards.forEach((card, index) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        setTimeout(() => {
          card.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, index * 100);
      });

    } catch (error) {
      console.error('記事一覧の読み込みに失敗しました:', error);
      container.innerHTML = '<p style="text-align: center; color: #ef4444;">記事の読み込みに失敗しました。</p>';
    }
  });
  </script>
</body>
</html>
