<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- OGP -->
  <meta property="og:title" content="ギガ使用ペースチェッカー｜スマホの通信量ペースを無料診断">
  <meta property="og:description" content="月間プランと今月の使用量を入力するだけ。今日使える通信量・月末予測・ペース判定を瞬時に表示。登録不要・無料。">

  <meta name="twitter:title" content="ギガ使用ペースチェッカー｜通信量ペースを無料診断">

  <!-- CSS（toolstyle.cssに一本化） -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/footer.css">
  <link rel="stylesheet" href="/tools/data-checker/toolstyle.css">

  <!-- result-grid: PC表示のみ2×2グリッド（toolstyle.cssへの追記と同内容） -->
  <style>
  @media (min-width: 641px) {
    .result-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
  </style>

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header-outlet"></div>
  <nav id="breadcrumb-outlet"></nav>

  <div class="tool-container">
    <div class="panel">

      <!-- h1は非表示（SEO用） -->
      <h1 style="display:none;">ギガ使用ペースチェッカー</h1>

      <!-- STEP 1: 月間プラン選択 -->
      <div class="panel-card">
        <div class="sec-title">
          <span class="step-badge">1</span>
          月間プランを選択
        </div>
        <div class="plan-tabs">
          <button class="plan-tab" data-gb="3">3GB</button>
          <button class="plan-tab" data-gb="20">20GB</button>
          <button class="plan-tab active" data-gb="50">50GB</button>
        </div>
        <div class="custom-row">
          <label for="customPlan">カスタム</label>
          <input type="number" id="customPlan" class="custom-input" placeholder="0" min="1" max="999" step="1">
          <span>GB</span>
        </div>
      </div>

      <!-- STEP 2: 今月の使用量 -->
      <div class="panel-card">
        <div class="sec-title">
          <span class="step-badge">2</span>
          今月の使用量
        </div>

        <!-- 使用済み入力 -->
        <div class="usage-card">
          <div class="usage-card-title">使用済み（GB）</div>
          <input
            type="number"
            id="usedInput"
            class="custom-input"
            value="0.0"
            min="0"
            step="0.1"
            style="width:100%; text-align:center; font-size:28px; padding:10px;"
          >
        </div>

        <!-- スライダー（使用済み入力の直下） -->
        <div class="slider-row">
          <input type="range" id="slider" class="slider" min="0" max="50" step="0.1" value="0">
        </div>

        <!-- 残り表示 -->
        <div class="usage-card" style="margin-top:14px;">
          <div class="usage-card-title">残り</div>
          <div>
            <span id="remainVal" class="usage-val" style="color:var(--teal);">50.0</span>
            <span style="font-size:16px; font-weight:600; color:var(--teal);">GB</span>
          </div>
        </div>
      </div>

      <!-- 診断結果 -->
      <div class="panel-card">

        <!-- バッジ -->
        <div class="result-header">
          <div class="badge">
            <span id="badgeEmoji">🎉</span>
            <span id="badgeText">超快適ペース</span>
          </div>
        </div>

        <!-- ドーナツチャート -->
        <div class="donut-wrap">
          <svg width="210" height="210" viewBox="0 0 210 210">
            <circle class="donut-bg" cx="105" cy="105" r="90"></circle>
            <circle id="donutBar" class="donut-bar" cx="105" cy="105" r="90"></circle>
          </svg>
          <div class="donut-center">
            <div id="pctText" class="donut-pct">0%</div>
            <div class="donut-lbl">使用率</div>
          </div>
        </div>

        <!-- メトリクス（tool.jsが参照するIDをすべて配置） -->
        <div class="result-grid">
          <div class="metric-card">
            <div class="metric-label">月末まで</div>
            <div id="countdown" class="metric-value">—</div>
            <div class="metric-meta">日</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">今日使える量</div>
            <div class="metric-value" style="color:var(--safe);">
              <span id="todayNum">0.00</span>
            </div>
            <div class="metric-meta">GB / 日</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">残り</div>
            <div class="metric-value" style="color:var(--teal);">
              <!-- tool.jsが参照するremainMeta -->
              <span id="remainMeta">50.0GB</span>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-label">月末予測</div>
            <div id="forecast" class="metric-value">—</div>
            <div class="metric-meta">GB 使用見込み</div>
          </div>
        </div>

        <!-- Tips -->
        <div id="tipsContainer" class="tips-grid"></div>
      </div>

      <!-- 関連記事 -->
      <div class="related-section">
        <h2 class="related-title">関連記事</h2>
        <div class="related-grid">
          <a href="/articles/how-to-check-data-android.html" class="related-link">
            📱 Androidで通信量を確認する方法
          </a>
          <a href="/articles/iphone-check-data.html" class="related-link">
            📱 iPhoneで通信量を確認する方法
          </a>
          <a href="/articles/save-data-youtube.html" class="related-link">
            🎬 YouTubeで通信量を節約する方法
          </a>
          <a href="/articles/3gb-mobile-data.html" class="related-link">
            📊 月3GBで足りる人の特徴と節約術
          </a>
        </div>
      </div>

    </div>
  </div>

  <footer id="footer-outlet"></footer>

  <!-- JS（インラインJS廃止・tool.jsに一本化） -->
  <script src="/js/header.js"></script>
