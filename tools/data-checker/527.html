<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>
    ギガ使用ペースチェッカー｜スマホ通信量を5秒で無料診断
  </title>

  <meta name="description"
        content="今月の通信量を入力するだけで、今日あと何GB使えるか・月末予測・使いすぎ危険度を5秒で確認できる無料ツール。登録不要・iPhone/Android対応。">

  <meta name="robots"
        content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">

  <meta name="theme-color" content="#0f766e">

  <meta name="color-scheme" content="light dark">

  <link rel="canonical"
        href="https://gigapace-checker.vercel.app/tools/data-checker/">

  <!-- OGP -->
  <meta property="og:type" content="website">

  <meta property="og:locale" content="ja_JP">

  <meta property="og:site_name"
        content="ギガ使用ペースチェッカー">

  <meta property="og:title"
        content="ギガ使用ペースチェッカー｜スマホ通信量を5秒で無料診断">

  <meta property="og:description"
        content="今日あと何GB使える？月末まで足りる？を即診断。">

  <meta property="og:url"
        content="https://gigapace-checker.vercel.app/tools/data-checker/">

  <meta property="og:image"
        content="https://gigapace-checker.vercel.app/images/ogp.webp">

  <!-- Twitter -->
  <meta name="twitter:card"
        content="summary_large_image">

  <meta name="twitter:title"
        content="ギガ使用ペースチェッカー">

  <meta name="twitter:description"
        content="今日あと何GB使えるかを即診断。">

  <meta name="twitter:image"
        content="https://gigapace-checker.vercel.app/images/ogp.webp">

  <!-- Fonts -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        as="style"
        onload="this.onload=null;this.rel='stylesheet'">

  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  </noscript>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/footer.css">

  <!-- ツール専用CSS -->
  <link rel="stylesheet"
        href="/tools/data-checker/toolstyle.css">

  <!-- ダークモードFOUC対策 -->
  <script>
  (() => {

    const saved = localStorage.getItem('theme');

    const systemDark =
      window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (
      saved === 'dark' ||
      (!saved && systemDark)
    ) {
      document.documentElement.classList.add('dark');
    }

  })();
  </script>
</head>

<body>

<header id="site-header"></header>

<main class="tool-container">

  <div class="panel">

    <!-- Hero -->
    <section class="hero">

      <h1>
        ギガ使用ペースチェッカー
      </h1>

      <p>
        今日あと何GB使える？
        月末まで足りる？を5秒で診断
      </p>

    </section>

    <!-- STEP1 -->
    <section class="panel-card">

      <div class="sec-title">
        <span class="step-badge">1</span>
        月間プランを選択
      </div>

      <div class="plan-tabs">

        <button class="plan-tab"
                data-gb="3">
          3GB
        </button>

        <button class="plan-tab"
                data-gb="10">
          10GB
        </button>

        <button class="plan-tab"
                data-gb="20">
          20GB
        </button>

        <button class="plan-tab"
                data-gb="30">
          30GB
        </button>

        <button class="plan-tab active"
                data-gb="50">
          50GB
        </button>

        <button class="plan-tab"
                data-gb="100">
          100GB
        </button>

      </div>

      <div class="custom-row">

        <label for="customPlan">
          カスタム
        </label>

        <input type="number"
               id="customPlan"
               class="custom-input"
               placeholder="50">

        <span>GB</span>

      </div>

    </section>

    <!-- STEP2 -->
    <section class="panel-card">

      <div class="sec-title">
        <span class="step-badge">2</span>
        今月の使用量を入力
      </div>

      <div class="usage-grid">

        <div class="usage-card">

          <div class="usage-card-title">
            今月の使用量
          </div>

          <input type="number"
                 id="usedInput"
                 class="custom-input"
                 value="0.0"
                 step="0.1"
                 min="0">

        </div>

        <div class="usage-card">

          <div class="usage-card-title">
            残り
          </div>

          <div>
            <span id="remainVal"
                  class="usage-val">
              50.0
            </span>
            GB
          </div>

        </div>

      </div>

      <div class="slider-row">

        <input type="range"
               id="slider"
               class="slider"
               min="0"
               max="50"
               step="0.1"
               value="0">

      </div>

    </section>

    <!-- RESULT -->
    <section class="panel-card">

      <div class="result-header">

        <div class="badge">

          <span id="badgeEmoji">
            🎉
          </span>

          <span id="badgeText">
            超快適ペース
          </span>

        </div>

      </div>

      <div class="donut-wrap">

        <svg width="210"
             height="210">

          <circle class="donut-bg"
                  cx="105"
                  cy="105"
                  r="90"></circle>

          <circle id="donutBar"
                  class="donut-bar"
                  cx="105"
                  cy="105"
                  r="90"></circle>

        </svg>

        <div class="donut-center">

          <div id="pctText"
               class="donut-pct">
            0%
          </div>

          <div class="donut-lbl">
            使用率
          </div>

        </div>

      </div>

      <div class="result-grid">

        <div class="metric-card">

          <div class="metric-label">
            今日使える量
          </div>

          <div class="metric-value">
            <span id="todayNum">
              0.00
            </span>
            GB
          </div>

          <div class="metric-meta">
            月末まで残り
            <span id="countdown">
              30日
            </span>
          </div>

        </div>

        <div class="metric-card">

          <div class="metric-label">
            月末予測
          </div>

          <div id="forecast"
               class="metric-value">
            0GB
          </div>

          <div class="metric-meta">
            残り
            <span id="remainMeta">
              50GB
            </span>
          </div>

        </div>

      </div>

      <div class="tips-grid"
           id="tipsContainer"></div>

    </section>

    <!-- 関連記事 -->
    <section class="related-section">

      <h2 class="related-title">
        関連記事
      </h2>

      <div class="related-grid">

        <a href="/articles/how-to-check-data-android.html"
           class="related-link">
          📱 Androidで通信量を確認する方法
        </a>

        <a href="/articles/iphone-check-data.html"
           class="related-link">
          🍎 iPhoneで通信量を確認する方法
        </a>

        <a href="/articles/save-data-youtube.html"
           class="related-link">
          🎬 YouTubeで通信量を節約する方法
        </a>

      </div>

    </section>

  </div>

</main>

<footer id="site-footer"></footer>

<!-- ダークモード -->
<button id="themeToggle"
        class="theme-toggle"
        aria-label="ダークモード切替">
  🌙
</button>

<script src="/js/header.js" defer></script>

<script src="/js/footer.js" defer></script>

  </html>
