```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイトマップ｜ギガ使用ペースチェッカー</title>
    <meta name="description" content="ギガ使用ペースチェッカーの全ページ一覧。ツール、記事コンテンツ、各種情報ページへのリンク集です。">
    <link rel="canonical" href="https://gigapace-checker.vercel.app/sitemap.html">

    <!-- 共通リソースの読み込み -->
    <link rel="stylesheet" href="/style.css">
    
    <!-- 外部JSの読み込み -->
    <script src="/analytics.js" defer></script>
    <script src="/header.js" defer></script>
    <script src="/footer.js" defer></script>
</head>
<body>

<main class="container">
    <div class="hero-bg">
        <h1>🗺️ サイトマップ</h1>
        <p>全コンテンツの最新一覧です。記事やブログが追加されると自動的にここに反映されます。</p>
    </div>

    <!-- 固定ページセクション -->
    <section class="card">
        <h2 style="border-bottom: 2px solid var(--navy); padding-bottom: 8px; margin-bottom: 1.5rem;">📄 メインページ & ツール</h2>
        <div style="display: grid; gap: 0.75rem;">
            <a href="/" class="sitemap-item">🏠 ホーム</a>
            <a href="/tools/data-checker/" class="sitemap-item">📊 ギガ使用ペースチェッカー</a>
            <a href="/profile.html" class="sitemap-item">👤 運営者・このサイトについて</a>
            <a href="/contact.html" class="sitemap-item">📧 お問い合わせ</a>
        </div>
    </section>

    <!-- 自動生成セクション：節約記事 -->
    <section class="card">
        <h2 style="border-bottom: 2px solid var(--navy); padding-bottom: 8px; margin-bottom: 1.5rem;">📑 節約記事（最新順）</h2>
        <div id="sitemap-articles" style="display: grid; gap: 0.75rem;">
            <p style="color: #6b7280; font-size: 0.9rem;">読み込み中...</p>
        </div>
    </section>

    <!-- 自動生成セクション：ブログ -->
    <section class="card">
        <h2 style="border-bottom: 2px solid var(--navy); padding-bottom: 8px; margin-bottom: 1.5rem;">📝 ブログ・開発秘話</h2>
        <div id="sitemap-blog" style="display: grid; gap: 0.75rem;">
            <p style="color: #6b7280; font-size: 0.9rem;">読み込み中...</p>
        </div>
    </section>

    <!-- 法的情報 -->
    <section class="card">
        <h2 style="border-bottom: 2px solid var(--navy); padding-bottom: 8px; margin-bottom: 1.5rem;">⚖️ 規約・その他</h2>
        <div style="display: grid; gap: 0.75rem;">
            <a href="/privacy.html" class="sitemap-item">🔒 プライバシーポリシー</a>
            <a href="/terms.html" class="sitemap-item">📜 利用規約</a>
        </div>
    </section>
</main>

<style>
/* サイトマップ専用の簡易スタイル */
.sitemap-item {
    display: block;
    padding: 0.75rem 1rem;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;
    text-decoration: none;
    color: var(--navy);
    font-weight: 500;
    font-size: 0.95rem;
    transition: all 0.2s ease;
}
.sitemap-item:hover {
    border-color: var(--accent);
    background: #f0f9ff;
    transform: translateX(4px);
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 汎用フェッチ＆レンダリング関数
    async function loadToSitemap(jsonPath, containerId, urlPrefix) {
        const container = document.getElementById(containerId);
        try {
            const response = await fetch(jsonPath);
            if (!response.ok) throw new Error();
            const data = await response.json();
            
            if (data.length === 0) {
                container.innerHTML = '<p style="color: #6b7280;">記事がありません。</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <a href="${urlPrefix}${item.filename}" class="sitemap-item">
                    ${item.title}
                    <span style="font-size: 0.75rem; color: #9ca3af; font-weight: normal; margin-left: 8px;">
                        ${item.date || ''}
                    </span>
                </a>
            `).join('');
        } catch (e) {
            container.innerHTML = '<p style="color: #ef4444;">読み込みエラー</p>';
        }
    }

    // 記事とブログをそれぞれ読み込み
    loadToSitemap('/articles.json', 'sitemap-articles', '/articles/');
    loadToSitemap('/blog.json', 'sitemap-blog', '/blog/');
});
</script>

</body>
</html>
