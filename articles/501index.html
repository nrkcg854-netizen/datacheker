<html lang="ja">
<head>

  <meta property="og:image" content="https://gigapace-checker.vercel.app/images/ogp-default.webp">

  <meta property="og:locale" content="ja_JP">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="通信量節約・ガジェット解説記事一覧">
  <meta name="twitter:description" content="スマホの通信量を賢く節約するためのガイド記事一覧。">
  <meta name="twitter:image" content="https://gigapace-checker.vercel.app/images/ogp-default.webp">
  
  <!-- Robots -->
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/style.css">
  
  <!-- 構造化データ - CollectionPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "通信量節約・ガジェット解説記事一覧",
    "description": "スマホの通信量を賢く節約するためのガイド記事一覧。3GBプランの活用法やYouTubeのギガ節約術などをロジカルに解説。",
    "url": "https://gigapace-checker.vercel.app/articles/",
    "isPartOf": {
      "@type": "WebSite",
      "name": "ギガ使用ペースチェッカー",
      "url": "https://gigapace-checker.vercel.app/"
    }
  }
  </script>
  
  <!-- 構造化データ - BreadcrumbList -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "ホーム",
        "item": "https://gigapace-checker.vercel.app/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "節約記事一覧",
        "item": "https://gigapace-checker.vercel.app/articles/"
      }
    ]
  }
  </script>
</head>
<body>
  <!-- header.js がここにヘッダーを挿入 -->

  <!-- パンくずリスト -->
  <nav aria-label="パンくずリスト" class="container" style="margin-top: 1.5rem;">
    <ol style="display: flex; gap: 0.5rem; list-style: none; font-size: 0.875rem; color: var(--text-muted);">
      <li><a href="/index.html">ホーム</a></li>
      <li>›</li>
      <li aria-current="page">節約記事一覧</li>
    </ol>
  </nav>

  <!-- メインコンテンツ -->
  <main class="container">
    <div class="hero-bg" style="padding: 3rem 2rem; border-radius: 1.5rem; margin: 2rem 0;">
      <h1 style="text-align: center; margin-bottom: 1rem;">節約記事一覧</h1>
      <p style="text-align: center; font-size: 1.125rem; color: var(--text-muted);">データ通信の仕組みを理解し、賢くコストを抑えるための情報を発信しています。</p>
    </div>

    <!-- 記事一覧コンテナ -->
    <div id="article-list-container" style="display: grid; gap: 1.5rem; margin-top: 2rem;">
      <p style="text-align: center; color: var(--text-muted); font-weight: 500;">記事を読み込み中...</p>
    </div>
  </main>

  <!-- footer.js がここにフッターを挿入 -->

  <!-- JavaScript -->
  <script src="/analytics.js" defer></script>
  <script src="/header.js" defer></script>
  <script src="/footer.js" defer></script>
  <script src="/js/main.js" defer></script>
  
  <!-- 記事一覧自動生成スクリプト -->
  <script>
  document.addEventListener("DOMContentLoaded", async function() {
    const container = document.getElementById('article-list-container');
    
    try {
      // articles.json を読み込む
      const response = await fetch('/articles.json');
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const articles = await response.json();
      
      // ローディング表示を消す
      container.innerHTML = '';
      
      if (articles.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">現在公開されている記事はありません。</p>';
        return;
      }

      // 記事の数だけカードを作る
      articles.forEach(article => {
        const articleUrl = `/articles/${article.filename}`;
        const dateHtml = article.date 
          ? `<span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">${article.date}</span>` 
          : '';

        const cardHTML = `
          <a href="${articleUrl}" style="text-decoration: none; color: inherit; display: block;">
            <div class="card" style="padding: 1.75rem;">
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                  <span style="background: var(--gradient-primary); color: white; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em;">節約ガイド</span>
                  ${dateHtml}
                </div>
                <h2 style="margin: 0; font-size: 1.35rem; color: var(--teal); line-height: 1.4;">${article.title}</h2>
                <p style="font-size: 1rem; color: var(--text-muted); margin: 0; line-height: 1.65;">${article.description}</p>
              </div>
            </div>
          </a>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });

      // カードにフェードインアニメーションを適用
      const cards = container.querySelectorAll('.card');
      cards.forEach((card, index) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        setTimeout(() => {
          card.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, index * 100);
      });

    } catch (error) {
      console.error('記事一覧の読み込みに失敗しました:', error);
      container.innerHTML = '<p style="text-align: center; color: #ef4444; font-weight: 600;">記事の読み込みに失敗しました。時間をおいて再読み込みしてください。</p>';
    }
  });
  </script>
</body>
</html>
