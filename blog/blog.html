            実際に行った施策を公開しています。
          </p>
        </div>
      </div>
    </section>

    <!-- ブログ一覧 -->
    <section aria-labelledby="blog-list-heading">
      <div class="article-content">
        <div class="prose">
          <h2 id="blog-list-heading">公開中の記事一覧</h2>

  <!-- JavaScript -->
  <script src="/js/analytics.js" defer></script>
  <script src="/js/header.js" defer></script>
  <script src="/js/breadcrumb.js" defer></script>
  <script src="/js/cta.js" defer></script>
  <script src="/js/footer.js" defer></script>
  <script src="/js/main.js" defer></script>

  <!-- ブログ一覧自動生成 -->
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    const container = document.getElementById('blog-list-container');

    try {
      const response = await fetch('/blog.json');

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const blogPosts = await response.json();

      container.innerHTML = '';

      if (!Array.isArray(blogPosts) || blogPosts.length === 0) {
        container.innerHTML = `
          <p>
            現在公開されているブログ記事はありません。
          </p>
        `;
        return;
      }

      const list = document.createElement('div');
      list.className = 'articles-grid';

      blogPosts.forEach(post => {
        const article = document.createElement('article');
        article.className = 'card';

        const dateHtml = post.date
          ? `<p class="card-meta">${post.date}</p>`
          : '';

        article.innerHTML = `
          <a href="/blog/${post.filename}">
            <h2>${post.title}</h2>
          </a>

          ${dateHtml}

          <p>
            ${post.description}
          </p>
        `;

        list.appendChild(article);
      });

      container.appendChild(list);

    } catch (error) {
      console.error('ブログ一覧の読み込みに失敗しました:', error);

      container.innerHTML = `
        <p>
          ブログの読み込みに失敗しました。
          時間をおいて再読み込みしてください。
        </p>
      `;
    }
  });
  </script>
