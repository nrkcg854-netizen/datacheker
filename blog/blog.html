  <!-- JavaScript -->
  <script src="/js/analytics.js" defer></script>

  <script src="/js/footer.js" defer></script>
  <script src="/js/main.js" defer></script>
  
  <!-- ブログ一覧自動生成スクリプト -->
  <script>
  document.addEventListener("DOMContentLoaded", async function() {
    const container = document.getElementById('blog-list-container');
    
    try {
      // blog.json を読み込む
      const response = await fetch('/blog.json');
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const blogPosts = await response.json();
      
      // ローディング表示を消す
      container.innerHTML = '';
      
      if (blogPosts.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">現在公開されているブログ記事はありません。</p>';
        return;
      }

      // ブログ記事の数だけカードを作る
      blogPosts.forEach(post => {
        const postUrl = `/blog/${post.filename}`;
        const dateHtml = post.date 
          ? `<span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">${post.date}</span>` 
          : '';

        const cardHTML = `
          <a href="${postUrl}" style="text-decoration: none; color: inherit; display: block;">
            <div class="card" style="padding: 1.75rem;">
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                  <span style="background: var(--amber); color: white; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em;">ブログ</span>
                  ${dateHtml}
                </div>
                <h2 style="margin: 0; font-size: 1.35rem; color: var(--teal); line-height: 1.4;">${post.title}</h2>
                <p style="font-size: 1rem; color: var(--text-muted); margin: 0; line-height: 1.65;">${post.description}</p>
              </div>
            </div>
          </a>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });

      // カードにフェードインアニメーションを適用
      const cards = container.querySelectorAll('.card');
      cards.forEach((card, index) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        setTimeout(() => {
          card.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, index * 100);
      });

    } catch (error) {
      console.error('ブログ一覧の読み込みに失敗しました:', error);
      container.innerHTML = '<p style="text-align: center; color: #ef4444; font-weight: 600;">ブログの読み込みに失敗しました。時間をおいて再読み込みしてください。</p>';
    }
  });
  </script>
